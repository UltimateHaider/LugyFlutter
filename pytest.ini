[pytest]
# ============================================================
# LugyFlutter - إعدادات pytest
# ============================================================
# هذا الملف يحتوي على جميع إعدادات pytest لاختبارات LugyFlutter
# ============================================================

# الإصدار الأدنى المطلوب من pytest
minversion = 7.0

# خيارات التشغيل الافتراضية
addopts =
    -ra
    -q
    --strict-markers
    --tb=short
    --color=yes
    --maxfail=5
    --no-header
    --disable-warnings
    --ignore=src/web/static
    --ignore=.venv
    --ignore=venv
    --ignore=build
    --ignore=dist

# مسارات الاختبارات
testpaths =
    src/tests

# أنماط ملفات الاختبارات
python_files =
    test_*.py
    *_test.py

# أنماط دوال الاختبارات
python_functions =
    test_*
    *_test

# أنماط كلاسات الاختبارات
python_classes =
    Test*
    *_Test

# وقت المهلة الافتراضي (بالثواني)
timeout = 300

# وضع asyncio
asyncio_mode = auto

# العلامات المخصصة
markers =
    asyncio: mark test as asynchronous
    slow: mark test as slow running
    fast: mark test as fast running
    integration: mark test as integration test
    unit: mark test as unit test
    ui: mark test as UI test
    api: mark test as API test
    browser: mark test as browser test
    smoke: mark test as smoke test
    regression: mark test as regression test
    performance: mark test as performance test
    security: mark test as security test

# تجاهل التحذيرات
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::ImportWarning
    ignore::ResourceWarning
    ignore::UserWarning:.*langchain.*
    ignore::UserWarning:.*pydantic.*
    ignore::UserWarning:.*streamlit.*
    ignore::DeprecationWarning:.*pytesseract.*
    ignore:.*database.*:UserWarning
    ignore:.*tensorflow.*:UserWarning
    ignore:.*sklearn.*:UserWarning

# إعدادات التحذيرات الصارمة
strict_config = true
strict_markers = true

# إعدادات إعادة تشغيل الاختبارات الفاشلة
stepwise = true
stepwise_skip = true

# إعدادات تسجيل التحذيرات
log_cli = true
log_cli_level = WARNING
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# إعدادات تسجيل الملفات
log_file = logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)s] %(filename)s:%(lineno)d - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# إعدادات junit.xml (لتقارير CI/CD)
junit_family = xunit2
junit_logging = all
junit_log_passing_tests = true

# إعدادات التغطية (يتم تفعيلها مع --cov)
# هذه الإعدادات تستخدم مع pytest-cov
# يمكن تفعيلها عن طريق إضافة --cov في addopts أو سطر الأوامر

# إعدادات التغطية الافتراضية
# لإلغاء التغطية الافتراضية، استخدم --no-cov

# إعدادات التقارير
report_title = LugyFlutter Test Report
report_verbosity = 2

# إعدادات الاختبارات المتزامنة
# يمكن تغيير عدد العمال باستخدام -n
# مثال: pytest -n auto

# إعدادات الإخراج
console_output_style = progress
console_output_style = count

# إعدادات إعادة المحاولة (مع pytest-rerunfailures)
# مثال: pytest --reruns 3 --reruns-delay 1
reruns = 3
reruns_delay = 2

# إعدادات الاختبارات المتسلسلة (مع pytest-order)
order_scope = package

# ============================================================
# إعدادات التغطية (Coverage)
# ============================================================

# مسار المصدر
# تم نقله إلى pyproject.toml ولكن يمكن وضعه هنا أيضاً
# --cov=src

# إضافة خيارات التغطية
# --cov-report=term-missing
# --cov-report=html:htmlcov
# --cov-report=xml:coverage.xml
# --cov-fail-under=70

# استثناءات التغطية
# --cov-omit=src/tests/*
# --cov-omit=src/web/static/*
# --cov-omit=src/_version.py

# ============================================================
# إعدادات الملفات المؤقتة
# ============================================================

# مسار الملفات المؤقتة (لـ pytest-xdist)
# tmp_path_factory = /tmp/pytest

# ============================================================
# إعدادات المصادقة (لـ pytest-httpserver)
# ============================================================

# httpserver = localhost:8888
# httpserver_timeout = 10

# ============================================================
# إعدادات الإشعارات (لـ pytest-notify)
# ============================================================

# notify = true
# notify_format = notification

# ============================================================
# إعدادات السجلات (لـ pytest-html)
# ============================================================

# html_report = reports/test_report.html
# self_contained_html = true

# ============================================================
# مثال لاستخدام الأعلام في سطر الأوامر
# ============================================================

# تشغيل الاختبارات العادية:
# pytest

# تشغيل مع تغطية:
# pytest --cov=src --cov-report=html

# تشغيل اختبارات محددة:
# pytest -m "unit and not slow"

# تشغيل مع تعدد العمال:
# pytest -n auto

# تشغيل مع إعادة المحاولة:
# pytest --reruns 3

# تشغيل مع التقاط التحذيرات:
# pytest -W error::DeprecationWarning

# تشغيل مع تفعيل التصحيح:
# pytest --pdb

# تشغيل مع تقرير HTML:
# pytest --html=reports/report.html --self-contained-html